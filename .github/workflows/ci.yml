name: CI

on:
  push:
    # main is the only long-lived branch; work reaches it through pull
    # requests from short-lived branches (CONTRIBUTING.md, "Branches").
    # launch-fixes and add-firefox-support, once listed here as working
    # branches (#269), were merged and deleted.
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bun writes bun.lock and builds the bundles, so its exact version
      # matters; .tool-versions is the single source of truth for it.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      # Node runs every bunx tool and the Tailwind step of the build;
      # .tool-versions is the single source of truth for its version.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - run: bun install --frozen-lockfile

      - run: just check

      - run: just lint

      - run: just format_check

      - run: just check_locales

      - run: just test

      # package_zip depends on the build recipe, so this also verifies the build
      - run: just package_zip

      # lint_firefox depends on build_firefox, so this also verifies the
      # Firefox-target build; web-ext lint (AMO's linter) failing fails CI.
      - run: just lint_firefox

      - run: just package_zip_firefox

      # Explicit per-browser globs: both zips live in builds/, so each
      # artifact must name its own suffix.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-zip
          path: builds/*_Chrome.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-zip
          path: builds/*_Firefox.zip
          if-no-files-found: error

  # Proves the AMO source package rebuilds to the shipped Firefox artifact:
  # build once from the checkout, once from a clean `git archive` of the
  # same tree (exactly what the release attaches as the source zip), and
  # fail on ANY content difference. Zip container timestamps are the only
  # thing not normalized, hence the extracted-tree comparison.
  reproducible-firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bun writes bun.lock and builds the bundles, so its exact version
      # matters; .tool-versions is the single source of truth for it.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      # Node runs every bunx tool and the Tailwind step of the build;
      # .tool-versions is the single source of truth for its version.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      - run: bun install --frozen-lockfile

      - name: Build from the checkout
        run: bun run scripts/build.ts --target firefox

      - name: Build from the source package
        run: |
          git archive --format=tar HEAD | (mkdir -p /tmp/source-pkg && tar -x -C /tmp/source-pkg)
          cd /tmp/source-pkg
          bun install --frozen-lockfile
          bun run scripts/build.ts --target firefox

      - name: Compare artifacts byte for byte
        run: |
          diff -r builds/firefox /tmp/source-pkg/builds/firefox
          echo "reproducible: source-package rebuild is content-identical"

  # Real-Firefox end-to-end suite: headless Firefox + geckodriver drive the
  # packaged artifact through the automated docs/testing-firefox.md rows
  # (baseline/TCP/FPI cleanup, marker cookie, site-data plumbing).
  e2e-firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        id: setup-firefox
        with:
          # Pinned (together with PINNED_GECKODRIVER_VERSION in
          # e2e/helpers/firefox_driver.ts) so the job tests one known
          # browser/driver pair instead of chasing `latest`, which broke
          # 2026-07-21 when geckodriver 0.37.1 shipped. Bump both
          # deliberately when validating a new Firefox release.
          firefox-version: "152.0.6"

      # Bun writes bun.lock and builds the bundles, so its exact version
      # matters; .tool-versions is the single source of truth for it.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      # Node runs every bunx tool and the Tailwind step of the build;
      # .tool-versions is the single source of truth for its version.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - run: bun install --frozen-lockfile

      # The driver binary is fetched from github.com once per run, before
      # the first spec file, and a transient 504 there failed this job on
      # 2026-09-21 (#398). The download now retries, and the binary is
      # cached so a healthy run does not depend on that request at all.
      # node-geckodriver's cache path carries no version, so the key is
      # what makes a pin change fetch a fresh binary; the pin is read out
      # of the helper rather than written here a second time
      # (__tests__/ci-workflow.spec.ts checks that this still matches).
      - name: Read the pinned geckodriver version
        id: geckodriver
        run: |
          version=$(sed -n 's/^export const PINNED_GECKODRIVER_VERSION = "\(.*\)";$/\1/p' e2e/helpers/firefox_driver.ts)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/geckodriver-cache
          key: geckodriver-${{ runner.os }}-${{ steps.geckodriver.outputs.version }}

      - run: just e2e_firefox
        env:
          FIREFOX_BIN: ${{ steps.setup-firefox.outputs.firefox-path }}
          GECKODRIVER_CACHE_DIR: ${{ runner.temp }}/geckodriver-cache
