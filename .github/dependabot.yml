version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # The three codeql-action steps in codeql-analysis.yml share one
      # pinned SHA on lines 51/59/73, so three separate PRs each rewrite
      # the same file and conflict pairwise; one grouped PR moves all of
      # them together and keeps the steps on a single SHA.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Everything else under .github/workflows/: checkout, setup-bun,
      # setup-node, setup-just, upload-artifact, setup-firefox.
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"

  # Maintain dependencies for Bun (package.json + bun.lock)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # Was the default 5; the backlog hit that ceiling on 2026-08-02 and no
    # new bun PR appeared for the six weeks after.
    open-pull-requests-limit: 10
    # Mirrors bunfig.toml's install.minimumReleaseAge = 604800 (1 week).
    # Without this, Dependabot opens PRs for versions nobody can install
    # locally, because `bun install` refuses to resolve them.
    cooldown:
      default-days: 7
    groups:
      # react and react-dom must move in lockstep: React refuses to boot
      # when the two differ ("Incompatible React versions: The react and
      # react-dom packages must have the exact same version"), so split
      # PRs fail CI by construction -- #352 and #353 each failed 32
      # suites. The @types packages track the same release line and ride
      # along.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # The Vitest runner and its v8 coverage provider ship as one
      # version; a mismatch breaks `just test`.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
      # Tailwind 4's CLI and engine ship as a single release, and
      # prettier-plugin-tailwindcss sorts class lists using their data
      # (.prettierrc.mjs -> tailwindStylesheet), so a split bump can make
      # `just format_check` disagree with itself.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/cli"
      # Both halves decide what `just format_check` accepts; group them so
      # any reformat churn lands in one commit instead of two.
      prettier:
        patterns:
          - "prettier"
          - "prettier-plugin-tailwindcss"
      # One lint toolchain: eslint.config.mjs imports all five.
      eslint:
        patterns:
          - "eslint"
          - "eslint-config-prettier"
          - "eslint-plugin-react"
          - "typescript-eslint"
          - "globals"
      # Only the e2e-firefox job exercises these, and the runtime and its
      # @types must not drift apart.
      e2e-firefox:
        patterns:
          - "selenium-webdriver"
          - "@types/selenium-webdriver"
          - "geckodriver"
    # Major bumps are handled deliberately in the phased modernization
    # issues (React in Phase 3, etc.); Dependabot keeps minors and patches
    # flowing.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @types/bun's version tracks the Bun runtime (it depends on
      # bun-types at the identical version) and tsconfig.json loads it
      # globally via "types": ["bun"]. Bumping it alone would type-check
      # against APIs that CI's pinned `bun-version: "1.3.x"` runtime does
      # not have. It moves only with .bun-version and the CI pins.
      - dependency-name: "@types/bun"
