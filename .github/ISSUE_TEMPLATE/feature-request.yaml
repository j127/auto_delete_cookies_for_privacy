---
name: Feature Request
description: An idea for something the extension could do, or do better.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for sharing an idea! A few sentences are plenty.
  - type: textarea
    id: idea
    attributes:
      label: What would you like the extension to do?
      description: Describe the idea in your own words.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: How would it help you?
      description: What you were trying to do, or what bothers you about how it works now.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or examples help, and you can paste or drag them into this box.
