---
name: Bug Report
description: Something in the extension isn't working right.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem! Answer what you can. If you're not sure about something, just say so.
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Tell us what happened and what you expected instead. Screenshots help, and you can paste or drag them into this box.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What were you doing when it happened?
      description: The steps you took, if you remember them.
      placeholder: |
        1. Opened example.com
        2. Closed its tab
        3. A minute later, its cookies were still there
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Firefox, Brave, Edge, Other]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, ChromeOS, Other]
    validations:
      required: true
  - type: textarea
    id: system-details
    attributes:
      label: System details
      description: Click the extension's icon in your toolbar, then **More controls…**, then **Support**. Click the first **Copy to Clipboard** button and paste here. If you know your browser's version, add it (browser menu → Help → About).
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Your settings
      description: On the same page, click the second **Copy to Clipboard** button and paste here. It lists your settings only, not the sites you visit or keep.
