# Node is a real dependency of this repo even though Bun is the package
# manager. Every tool launched through `bunx` (tsc, eslint, prettier, vitest,
# web-ext) and the Tailwind CLI step of the build run on Node, because their
# launchers carry a node shebang and both bunx and Bun.spawn honour it. Bun
# itself only installs, bundles and runs scripts/.
#
# This file is the single source of truth for that Node version: mise reads
# it locally, and CI's actions/setup-node reads it through
# `node-version-file`. mise ignores .node-version and .nvmrc by default, so
# do not add one (a spec guards against it). The 24 line satisfies the
# `engines` ranges of the toolchain majors tracked in #396; the exact floor
# lives in package.json's `engines.node`.
[tools]
node = "24"
